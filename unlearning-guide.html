<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Inbox · Open Strings Academy</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #faf9f6;
      --text:       #1a1714;
      --text-mid:   #4a4540;
      --text-light: #7a7068;
      --border:     #ddd8cf;
      --crimson:    #8B1A2B;
      --font-serif: 'Lora', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;
    }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .wrap {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 2.5rem;
      display: block;
    }

    .rule {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 2.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--text-mid);
    }

    .sub {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-style: italic;
      color: var(--text-mid);
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .rule-bottom {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 2.5rem;
    }

    .note {
      font-size: 0.82rem;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .note strong {
      color: var(--text-mid);
      font-weight: 500;
    }

    .back-link {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-light);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .back-link:hover {
      color: var(--crimson);
      border-color: var(--crimson);
    }
  </style>
</head>
<body>

  <div class="wrap">
    <span class="eyebrow">Open Strings Academy</span>
    <div class="rule"></div>

    <h1>Check your<br><em>inbox.</em></h1>

    <p class="sub">The Unlearning Guide is on its way to you now.</p>

    <div class="rule-bottom"></div>

    <p class="note">
      <strong>Can't find it?</strong> Check your spam or promotions folder — and if it's there, move it to your inbox so you don't miss what comes next.
    </p>

    <a href="/" class="back-link">Back to Open Strings Academy</a>
  </div>

</body>
</html>
